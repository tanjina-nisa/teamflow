# Render Blueprint: creates the NestJS API + a PostgreSQL database.
# Render dashboard → New → Blueprint → pick this repo.
databases:
  - name: teamflow-db
    plan: free
    databaseName: teamflow

services:
  - type: web
    name: teamflow-api
    runtime: docker
    rootDir: apps/api
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "node dist/seed.js && node dist/main.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: teamflow-db, property: connectionString }
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://teamflow-saas-ivory.vercel.app
